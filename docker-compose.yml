services:
  postgres:
    image: postgres:16-alpine
    container_name: movie-reco-postgres
    environment:
      POSTGRES_DB: movie_reco_db
      POSTGRES_USER: movie_user
      POSTGRES_PASSWORD: movie_pass
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U movie_user -d movie_reco_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: movie-reco-redis
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: movie-reco-backend
    env_file:
      - ./apps/backend/.env.docker
    environment:
      APP_ENV_FILE: .env.docker
    ports:
      - "8000:8000"
    volumes:
      - ./apps/backend:/app
      - backend_artifacts:/app/artifacts_runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  content-worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: movie-reco-content-worker
    env_file:
      - ./apps/backend/.env.docker
    environment:
      APP_ENV_FILE: .env.docker
    volumes:
      - ./apps/backend:/app
      - backend_artifacts:/app/artifacts_runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python workers/content_worker.py

  cf-worker:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: movie-reco-cf-worker
    env_file:
      - ./apps/backend/.env.docker
    environment:
      APP_ENV_FILE: .env.docker
    volumes:
      - ./apps/backend:/app
      - backend_artifacts:/app/artifacts_runtime
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python workers/cf_worker.py
    profiles:
      - cf

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: movie-reco-frontend
    env_file:
      - ./apps/frontend/.env.docker
    ports:
      - "5173:5173"
    volumes:
      - ./apps/frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  backend_artifacts: